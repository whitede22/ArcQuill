<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArcQuill · 界面一览</title>
<link rel="icon" href="arcquill_icon.png">
<style>
  :root {
    --bg: #FBFBFA;
    --surface: #FFFFFF;
    --border: #E6E6E2;
    --divider: #EFEFEC;
    --text: #1F1F1E;
    --text2: #6E6E6A;
    --accent: #4A6FA5;
    --accent-soft: #EEF3FA;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    font-size: 15px;
    line-height: 1.75;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 28px; }

  header { padding: 72px 0 40px; border-bottom: 1px solid var(--divider); }
  .wordmark { height: 40px; width: auto; display: block; }
  h1 {
    font-size: 30px;
    line-height: 1.4;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 28px 0 12px;
  }
  .lede { margin: 0; max-width: 640px; color: var(--text2); font-size: 16px; }

  section { padding: 56px 0 0; }
  h2 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--text2);
    margin: 0 0 24px;
    text-transform: uppercase;
  }

  figure { margin: 0 0 44px; }
  figure a { display: block; }
  figure img:hover { border-color: #C9D4E4; }
  figure img {
    display: block;
    width: 100%;
    height: auto;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    box-shadow: 0 12px 32px rgba(31, 31, 30, 0.07);
  }
  figcaption { margin-top: 14px; }
  figcaption .name { font-weight: 600; }
  figcaption .desc { color: var(--text2); }

  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .cols { column-count: 2; column-gap: 28px; }
  .cols figure { break-inside: avoid; }

  .night {
    margin-top: 24px;
    background: #1B1B1A;
    border-radius: 14px;
    padding: 40px 40px 8px;
  }
  .night h2 { color: #9AA3AE; }
  .night figcaption .name { color: #F2F2EF; }
  .night figcaption .desc { color: #A5A8A3; }
  .night img { border-color: #2C2C2A; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4); }

  footer {
    margin-top: 64px;
    padding: 28px 0 56px;
    border-top: 1px solid var(--divider);
    color: var(--text2);
    font-size: 13px;
  }
  footer span + span::before { content: "·"; margin: 0 8px; color: #C4C2B9; }

  @media (max-width: 820px) {
    .pair, .cols { display: block; column-count: auto; }
    header { padding-top: 48px; }
    h1 { font-size: 24px; }
    .night { padding: 24px 20px 4px; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <img class="wordmark" src="arcquill_wordmark.png" alt="ArcQuill">
    <h1>查一次，就是一条生词。回头还能按计划复习。</h1>
    <p class="lede">
      本地的英语生词本。释义、搭配与例句排在一屏里，同义语的差别用一句话点出。
      接的是任意 OpenAI 兼容接口，不通时自动改用本机离线词库，并把来源写在词条上。
    </p>
  </div>
</header>

<div class="wrap">

  <section>
    <h2>查词</h2>
    <figure>
      <a href="01-lookup.png" target="_blank" rel="noopener"><img src="01-lookup.png" alt="查词主页"></a>
      <figcaption>
        <div class="name">回车即收藏</div>
        <div class="desc">同义语的差别用一句话点出，固定搭配可以单独收进词组。备注手写进去，重新查询不会覆盖。</div>
      </figcaption>
    </figure>
    <figure>
      <a href="02-phrases.png" target="_blank" rel="noopener"><img src="02-phrases.png" alt="词组收藏"></a>
      <figcaption>
        <div class="name">词组单独一处</div>
        <div class="desc">词组与单词分两张表存放，各自编号，删一边不会动到另一边。</div>
      </figcaption>
    </figure>
  </section>

  <section>
    <h2>复习与整理</h2>
    <div class="cols">
      <figure>
        <a href="03-review.png" target="_blank" rel="noopener"><img src="03-review.png" alt="复习"></a>
        <figcaption>
          <div class="name">四档评分</div>
          <div class="desc">按 SM-2 排下一次到期时间，忘了的词尽快回来。</div>
        </figcaption>
      </figure>
      <figure>
        <a href="05-import.png" target="_blank" rel="noopener"><img src="05-import.png" alt="导入"></a>
        <figcaption>
          <div class="name">导入先说清楚</div>
          <div class="desc">认出几条、跳过哪一行、依据是什么，都写在收录之前。</div>
        </figcaption>
      </figure>
      <figure>
        <a href="04-export.png" target="_blank" rel="noopener"><img src="04-export.png" alt="导出"></a>
        <figcaption>
          <div class="name">七种导出格式</div>
          <div class="desc">含 Anki 卡片和给程序读的 JSON。换工具不丢词。</div>
        </figcaption>
      </figure>
      <figure>
        <a href="07-refresh.png" target="_blank" rel="noopener"><img src="07-refresh.png" alt="重查"></a>
        <figcaption>
          <div class="name">批量重查只动内容</div>
          <div class="desc">备注与标签是你自己的，接口这次没答上来的词条保持原样。</div>
        </figcaption>
      </figure>
    </div>
  </section>

  <section>
    <h2>设置与外观</h2>
    <div class="pair">
      <figure>
        <a href="06-settings.png" target="_blank" rel="noopener"><img src="06-settings.png" alt="设置"></a>
        <figcaption>
          <div class="name">接口、词库、托盘</div>
          <div class="desc">地址与模型名按所选服务商填，测试连接只花一个 token。</div>
        </figcaption>
      </figure>
      <figure>
        <a href="08-background.png" target="_blank" rel="noopener"><img src="08-background.png" alt="自定义背景"></a>
        <figcaption>
          <div class="name">可以铺自己的图</div>
          <div class="desc">六套主题之外，还有一张自己的背景图。面板留出透明度，正文按对比度保底。</div>
        </figcaption>
      </figure>
    </div>
  </section>

  <section>
    <h2>第一次打开</h2>
    <div class="pair">
      <figure>
        <a href="09-onboarding.png" target="_blank" rel="noopener"><img src="09-onboarding.png" alt="欢迎页"></a>
        <figcaption>
          <div class="name">四步看完</div>
          <div class="desc">不想看就跳过，之后在设置里能重新打开。</div>
        </figcaption>
      </figure>
      <figure>
        <a href="10-fallback.png" target="_blank" rel="noopener"><img src="10-fallback.png" alt="接口失败时改用离线词库"></a>
        <figcaption>
          <div class="name">失败也留得住词</div>
          <div class="desc">接口超时后落到本机词库，顶部写明失败原因，右上角标「离线待重查」。</div>
        </figcaption>
      </figure>
    </div>
  </section>

  <div class="night">
    <h2>夜间</h2>
    <div class="pair">
      <figure>
        <a href="11-night-lookup.png" target="_blank" rel="noopener"><img src="11-night-lookup.png" alt="深色查词界面"></a>
        <figcaption>
          <div class="name">同一套界面</div>
          <div class="desc">底色、边框、占位文字各挑一份，不是把浅色反过来用。</div>
        </figcaption>
      </figure>
      <figure>
        <a href="12-night-settings.png" target="_blank" rel="noopener"><img src="12-night-settings.png" alt="深色设置界面"></a>
        <figcaption>
          <div class="name">设置也是</div>
          <div class="desc">换主题当场生效，取消则还原。</div>
        </figcaption>
      </figure>
    </div>
  </div>

</div>

<footer>
  <div class="wrap">
    <span>截图取自 ArcQuill 1.4.0</span><span>词条内容为演示数据</span><span>made by wtd22</span>
  </div>
</footer>

</body>
</html>
